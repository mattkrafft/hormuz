<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hormuz Command — Model Gallery</title>
<style>
:root{--bg:#03140d;--panel:#092719;--grid:#68a73922;--green:#b7e34b;--muted:#78b83e;--gold:#d8c849;--red:#f06d3d;--cyan:#b8fff0}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--green);font:16px "Courier New",monospace}
header{padding:28px 24px 18px;border-bottom:1px solid #68a73955;background:#061d12}
h1{margin:0 0 8px;font:700 32px Arial,sans-serif;text-transform:uppercase;letter-spacing:2px} p{margin:0;color:#9acb62}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding:20px;max-width:1280px;margin:auto}
figure{margin:0;border:1px solid #68a73955;background:var(--panel);box-shadow:inset 0 0 30px #0007}
canvas{display:block;width:100%;height:180px;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 24px),radial-gradient(circle at 50% 50%,#123c25,#061d12)}
figcaption{padding:10px 12px;border-top:1px solid #68a73933;color:#a9ea55;text-transform:uppercase;font-weight:bold}
small{display:block;margin-top:4px;color:#709c52;font-weight:normal;text-transform:none}
</style>
</head>
<body>
<header><h1>Hormuz Command Model Gallery</h1><p>Standalone visual reference for the current canvas-drawn gameplay elements.</p></header>
<main id="gallery"></main>
<script>
"use strict";
const specimens=[
 ["Eastbound tanker","Standard tanker silhouette",c=>ship(c,false)],
 ["Westbound tanker","Horizontally mirrored; remains upright",c=>ship(c,true)],
 ["U.S. base — idle","Launcher and ammunition readout",c=>base(c,"idle")],
 ["U.S. base — selected","Active base highlight",c=>base(c,"selected")],
 ["U.S. base — disabled","Two-second hit state",c=>base(c,"disabled")],
 ["Missile battery","Inland twin-rail enemy site",c=>enemySite(c,"missile")],
 ["Drone launch site","Coastal drone site",c=>enemySite(c,"drone")],
 ["Iranian missile","Ballistic body, fins and exhaust",c=>threat(c,"missile")],
 ["Iranian drone","Compact aircraft silhouette",c=>threat(c,"drone")],
 ["U.S. interceptor","Defensive projectile and trail",c=>interceptor(c)],
 ["Missile target","Fixed impact crosshair",c=>target(c)],
 ["Infrastructure","Refinery / terminal target",c=>infrastructure(c)],
 ["Friendly blast","Interceptor explosion radius",c=>blast(c,true)],
 ["Enemy blast","Hostile impact effect",c=>blast(c,false)],
 ["Impact sparks","Short-lived debris effect",c=>sparks(c)]
];
const gallery=document.getElementById("gallery");
for(const [title,note,draw] of specimens){
 const fig=document.createElement("figure"),canvas=document.createElement("canvas"),cap=document.createElement("figcaption");
 canvas.width=540;canvas.height=360;cap.innerHTML=title+"<small>"+note+"</small>";fig.append(canvas,cap);gallery.append(fig);draw(canvas.getContext("2d"));
}
function setup(ctx){ctx.translate(270,180);ctx.scale(2.2,2.2);ctx.lineCap="round";ctx.lineJoin="round"}
function poly(ctx,p,fill,stroke){ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ship(ctx,west){setup(ctx);ctx.save();if(west)ctx.scale(-1,1);ctx.scale(1.6,1.6);ctx.lineWidth=1;
 poly(ctx,[[-31,-5],[25,-5],[32,0],[24,6],[-27,6],[-33,2]],"#18331b","#b7e34b");
 ctx.fillStyle="#78b83e";ctx.fillRect(-21,-10,35,5);ctx.strokeStyle="#b7e34b";
 [-15,-5,5].forEach(x=>{ctx.beginPath();ctx.ellipse(x,-8,5,2.5,0,0,7);ctx.stroke()});
 ctx.fillStyle="#a9df54";ctx.fillRect(14,-14,10,9);ctx.fillRect(17,-20,4,6);ctx.restore()
}
function base(ctx,state){setup(ctx);const color=state==="disabled"?"#ff7138":state==="selected"?"#fff27a":"#d8c849";ctx.scale(1.8,1.8);ctx.strokeStyle=color;ctx.fillStyle=state==="disabled"?"#32150f":"#20351b";ctx.lineWidth=state==="selected"?2.5:1.5;ctx.strokeRect(-18,-7,36,14);ctx.fillRect(-16,-5,32,10);ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(8,-24);ctx.stroke();ctx.fillStyle=color;ctx.font="12px monospace";ctx.textAlign="center";ctx.fillText("10",0,29)}
function enemySite(ctx,type){setup(ctx);ctx.scale(2,2);ctx.strokeStyle="#f06d3d";ctx.fillStyle="#351812";ctx.lineWidth=1.4;
 if(type==="missile"){ctx.fillRect(-10,-7,20,14);ctx.strokeRect(-10,-7,20,14);ctx.beginPath();ctx.moveTo(-4,-8);ctx.lineTo(5,-22);ctx.moveTo(2,-8);ctx.lineTo(11,-22);ctx.stroke()}
 else{ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(0,-9);ctx.lineTo(16,0);ctx.lineTo(0,5);ctx.closePath();ctx.stroke()}
}
function threat(ctx,type){setup(ctx);ctx.scale(2.2,2.2);ctx.lineWidth=1;
 if(type==="missile"){ctx.fillStyle="#ffb04d";ctx.strokeStyle="#ffe0a8";ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(8,-3.2);ctx.lineTo(-8,-3.2);ctx.lineTo(-13,-7);ctx.lineTo(-12,-2.7);ctx.lineTo(-16,-1.8);ctx.lineTo(-16,1.8);ctx.lineTo(-12,2.7);ctx.lineTo(-13,7);ctx.lineTo(-8,3.2);ctx.lineTo(8,3.2);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle="#9d3e24";ctx.beginPath();ctx.moveTo(7,-3);ctx.lineTo(7,3);ctx.moveTo(-9,-3);ctx.lineTo(-9,3);ctx.stroke();ctx.fillStyle="#ff5c32";poly(ctx,[[-16,-1.8],[-23,0],[-16,1.8]],"#ff5c32");poly(ctx,[[-16,-.8],[-20,0],[-16,.8]],"#ffe164")}
 else{poly(ctx,[[11,0],[-2,-4],[-11,-2],[-4,0],[-11,2],[-2,4]],"#ff8a55","#ffd79a")}
}
function interceptor(ctx){setup(ctx);ctx.strokeStyle="#b8fff0cc";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-75,45);ctx.lineTo(-50,28);ctx.lineTo(-25,12);ctx.lineTo(0,0);ctx.stroke();ctx.fillStyle="#fff";ctx.fillRect(-2,-2,4,4)}
function target(ctx){setup(ctx);ctx.scale(2.4,2.4);ctx.strokeStyle="#ff9b4d";ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.moveTo(0,-10);ctx.lineTo(0,10);ctx.stroke()}
function infrastructure(ctx){setup(ctx);ctx.scale(2.2,2.2);ctx.strokeStyle="#d8c849";ctx.lineWidth=1.5;ctx.strokeRect(-20,-10,40,13);ctx.beginPath();ctx.arc(-10,-11,6,Math.PI,0);ctx.arc(9,-11,6,Math.PI,0);ctx.stroke()}
function blast(ctx,friendly){setup(ctx);ctx.scale(1.4,1.4);ctx.strokeStyle=friendly?"rgba(185,255,224,.9)":"rgba(255,113,56,.9)";ctx.lineWidth=2;[18,34,50].forEach((r,i)=>{ctx.globalAlpha=1-i*.25;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke()})}
function sparks(ctx){setup(ctx);ctx.fillStyle="#ffe164";for(let i=0;i<18;i++){const a=i*2.4,r=10+(i%6)*9;ctx.fillRect(Math.cos(a)*r,Math.sin(a)*r,2+(i%2),2+(i%2))}}
</script>
</body>
</html>
