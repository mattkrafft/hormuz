<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hormuz Command — Model Gallery</title><style>:root{--bg:#03140d;--panel:#092719;--grid:#68a73922;--green:#b7e34b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--green);font:16px "Courier New",monospace}header{padding:28px 24px 18px;border-bottom:1px solid #68a73955;background:#061d12}h1{margin:0 0 8px;font:700 32px Arial,sans-serif;text-transform:uppercase}p{margin:0;color:#9acb62}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding:20px;max-width:1280px;margin:auto}figure{margin:0;border:1px solid #68a73955;background:var(--panel)}canvas{display:block;width:100%;height:180px;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 24px),radial-gradient(circle at 50% 50%,#123c25,#061d12)}figcaption{padding:10px 12px;border-top:1px solid #68a73933;color:#a9ea55;text-transform:uppercase;font-weight:bold}small{display:block;margin-top:4px;color:#709c52;font-weight:normal;text-transform:none}</style></head><body><header><h1>Hormuz Command Model Gallery</h1><p>Revised defensive, hostile, and infrastructure models.</p></header><main id="gallery"></main><script>
const items=[["Al Udeid / Al Dhafra","Twin HIMARS trucks with outward launchers and center radar",c=>base(c)],["USS Roosevelt","Aegis destroyer entering after Day 3",c=>destroyer(c,false)],["Roosevelt CIWS","Purchasable drone self-defense gun",c=>destroyer(c,true)],["Iran missile battery","Truck with one 45-degree missile silo",c=>enemy(c,"missile")],["Iran drone launcher","Toyota Hilux-style pickup",c=>enemy(c,"drone")],["Iranian drone","Wider aircraft silhouette",c=>drone(c)],["Offshore infrastructure","Cluster of three offshore platforms — 4 HP",c=>offshore(c)],["Refinery infrastructure","Smokestack and spherical tank — 4 HP",c=>refinery(c)]];const g=document.getElementById("gallery");for(const [t,n,d]of items){let f=document.createElement("figure"),c=document.createElement("canvas"),cap=document.createElement("figcaption");c.width=540;c.height=360;cap.innerHTML=t+"<small>"+n+"</small>";f.append(c,cap);g.append(f);d(c.getContext("2d"))}function s(c){c.translate(270,180);c.scale(2.3,2.3);c.lineCap="round";c.lineJoin="round";c.strokeStyle="#d8c849";c.fillStyle="#20351b";c.lineWidth=1.5}function p(c,a,f,st){c.beginPath();a.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));c.closePath();c.fillStyle=f;c.fill();c.strokeStyle=st;c.stroke()}function truck(c,x=0){c.fillRect(x-15,-5,27,10);c.strokeRect(x-15,-5,27,10);[-10,7].forEach(w=>{c.beginPath();c.arc(x+w,7,3,0,7);c.stroke()})}function base(c){s(c);[-19,19].forEach((x,i)=>{truck(c,x);c.beginPath();c.moveTo(x+(i?-6:6),-7);c.lineTo(x+(i?9:-9),-25);c.stroke()});c.beginPath();c.arc(0,-10,8,0,7);c.stroke();c.beginPath();c.moveTo(0,-10);c.lineTo(10,-17);c.stroke()}function destroyer(c,gun){s(c);p(c,[[-42,-7],[28,-7],[43,0],[27,8],[-37,8],[-46,2]],"#18331b","#b7e34b");c.strokeRect(-6,-17,18,10);c.beginPath();c.moveTo(3,-17);c.lineTo(3,-33);c.stroke();if(gun){c.beginPath();c.arc(22,-11,5,0,7);c.stroke();c.beginPath();c.moveTo(22,-16);c.lineTo(30,-24);c.stroke()}}function enemy(c,t){s(c);c.strokeStyle="#f06d3d";c.fillStyle="#351 </script></body></html>
